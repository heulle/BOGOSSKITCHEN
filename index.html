<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Bogoss Kitchen">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BOGOSS KITCHEN</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #000; --surface: #1a1a1a; --surface2: #242424;
    --green: #06c167; --green-dark: #054d28;
    --leger-bg: #0d2414; --leger-text: #06c167;
    --flemme-bg: #221400; --flemme-text: #f59300;
    --comfort-bg: #220a0a; --comfort-text: #f04438;
    --text: #fff; --muted: #666; --border: rgba(255,255,255,0.08);
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
  header { background: #000; padding: 28px 20px 0; position: sticky; top: 0; z-index: 100; }
  .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .logo { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
  .logo span { color: var(--green); }
  .tagline { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .search-bar { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
  .search-icon { font-size: 14px; color: var(--muted); }
  #search { background: none; border: none; outline: none; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; flex: 1; }
  #search::placeholder { color: var(--muted); }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .filter-btn { flex-shrink: 0; font-size: 13px; font-weight: 600; padding: 8px 18px; border-radius: 100px; border: none; cursor: pointer; background: var(--surface); color: var(--muted); transition: all 0.18s; font-family: 'Inter', sans-serif; }
  .filter-btn.active { background: #fff; color: #000; }
  .filter-btn[data-cat="léger"].active { background: var(--leger-text); color: #000; }
  .filter-btn[data-cat="flemme"].active { background: var(--flemme-text); color: #000; }
  .filter-btn[data-cat="comfort"].active { background: var(--comfort-text); color: #fff; }
  #lucky-banner { display: none; margin: 16px 20px; padding: 20px; background: var(--surface); border-radius: 16px; border-left: 4px solid var(--green); position: relative; animation: slideIn 0.3s ease; }
  @keyframes slideIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
  #lucky-banner .label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--green); font-weight: 700; margin-bottom: 6px; }
  #lucky-banner .meal-name { font-size: 22px; font-weight: 800; }
  #lucky-banner .meal-cat { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #lucky-banner .close-lucky { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  main { padding: 16px 20px 120px; }
  .section { margin-bottom: 36px; }
  .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .section-title { font-size: 18px; font-weight: 800; }
  .section-count { font-size: 11px; color: var(--muted); font-weight: 600; }
  .section-line { flex: 1; height: 1px; background: var(--border); }
  .hidden { display: none !important; }
  .meals-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .meal-card { background: var(--surface); border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform 0.15s, background 0.15s; position: relative; animation: cardIn 0.3s ease both; }
  @keyframes cardIn { from { opacity:0; transform:scale(0.97); } to { opacity:1; transform:scale(1); } }
  .meal-card:hover { background: var(--surface2); transform: scale(1.02); }
  .card-img { height: 90px; display: flex; align-items: center; justify-content: center; font-size: 44px; }
  .meal-card.léger .card-img { background: var(--leger-bg); }
  .meal-card.flemme .card-img { background: var(--flemme-bg); }
  .meal-card.comfort .card-img { background: var(--comfort-bg); }
  .card-body { padding: 10px 12px 12px; }
  .meal-name-card { font-size: 13px; font-weight: 700; line-height: 1.35; margin-bottom: 6px; color: var(--text); }
  .meal-tags { display: flex; gap: 6px; align-items: center; }
  .tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 100px; }
  .tag.léger { background: var(--leger-bg); color: var(--leger-text); }
  .tag.flemme { background: var(--flemme-bg); color: var(--flemme-text); }
  .tag.comfort { background: var(--comfort-bg); color: var(--comfort-text); }
  .meal-card:hover
  .empty-msg { color: var(--muted); font-size: 13px; font-style: italic; padding: 16px 0; }
  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #111; border-top: 1px solid var(--border); padding: 12px 20px 24px; display: flex; gap: 10px; z-index: 200; }
  .inspire-btn { flex: 1; background: var(--green); color: #000; border: none; border-radius: 14px; padding: 16px; font-size: 15px; font-weight: 800; cursor: pointer; font-family: 'Inter', sans-serif; transition: opacity 0.18s; }
  .inspire-btn:hover { opacity: 0.88; }
  .add-btn { background: var(--surface2); color: var(--text); border: none; border-radius: 14px; padding: 16px 20px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.18s; white-space: nowrap; }
  .add-btn:hover { background: #333; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 20px 20px 0 0; padding: 28px 24px 36px; width: 100%; max-width: 520px; animation: modalUp 0.25s ease; max-height: 90vh; overflow-y: auto; }
  @keyframes modalUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 24px; }
  .modal-title span { color: var(--green); }
  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .form-input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; font-family: 'Inter', sans-serif; font-size: 14px; outline: none; border-radius: 10px; transition: border-color 0.2s; }
  .form-input:focus { border-color: var(--green); }
  .form-input::placeholder { color: var(--muted); }
  .cat-selector { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .cat-option { padding: 10px 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 700; font-family: 'Inter', sans-serif; border-radius: 10px; transition: all 0.18s; text-align: center; }
  .cat-option[data-val="léger"].selected { border-color: var(--leger-text); color: var(--leger-text); background: var(--leger-bg); }
  .cat-option[data-val="flemme"].selected { border-color: var(--flemme-text); color: var(--flemme-text); background: var(--flemme-bg); }
  .cat-option[data-val="comfort"].selected { border-color: var(--comfort-text); color: var(--comfort-text); background: var(--comfort-bg); }
  .cat-option:hover { border-color: #555; color: #fff; }
  .emoji-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .emoji-opt { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: var(--bg); border: 1px solid var(--border); cursor: pointer; font-size: 18px; border-radius: 8px; transition: all 0.15s; }
  .emoji-opt.selected { border-color: var(--green); background: rgba(6,193,103,0.1); }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn-save { flex: 1; background: var(--green); color: #000; border: none; border-radius: 14px; padding: 14px; font-size: 15px; font-weight: 800; cursor: pointer; font-family: 'Inter', sans-serif; }
  .btn-cancel { background: var(--surface2); color: var(--muted); border: none; border-radius: 14px; padding: 14px 20px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 12px 20px; font-size: 13px; font-weight: 600; z-index: 9999; animation: toastIn 0.2s ease; border-radius: 100px; white-space: nowrap; }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(8px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
  @media (min-width: 600px) { header, main { padding-left: 40px; padding-right: 40px; } .meals-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } .bottom-bar { padding-left: 40px; padding-right: 40px; } }
  .ubereats-bg { background: #1a1000; }
  .tag.ubereats { background: #1a1000; color: #fa5252; }
  .meal-card.ubereats .card-img { background: #1a1000; }
  .cat-option[data-val="ubereats"].selected { border-color: #fa5252; color: #fa5252; background: #1a1000; }
  .filter-btn[data-cat="ubereats"].active { background: #fa5252; color: #fff; }
  .meal-card.painquotidien .card-img { background: #1a1200; }
  .tag.painquotidien { background: #1a1200; color: #f0b429; }
  .filter-btn[data-cat="painquotidien"].active { background: #f0b429; color: #000; }
  .cat-option[data-val="painquotidien"].selected { border-color: #f0b429; color: #f0b429; background: #1a1200; }
  .boisson-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
  .boisson-opt { padding: 10px 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 700; font-family: 'Inter', sans-serif; border-radius: 10px; transition: all 0.18s; text-align: center; }
  .boisson-opt.selected { border-color: var(--green); color: var(--green); background: rgba(6,193,103,0.1); }
  .boisson-opt:hover { border-color: #555; color: #fff; }
  .boisson-detail { margin-top: 8px; }
</style>
</head>

const STORAGE_KEY = 'bogoss_kitchen_meals';
let currentFilter = 'all';
let selectedCat = null;
let selectedEmoji = '🍝';

function loadMeals() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) return JSON.parse(stored);
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_MEALS));
}

function saveMeals(meals) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(meals)); } catch(e) {}
}

let meals = loadMeals();

function getQuery() {
  return document.getElementById('search').value.toLowerCase().trim();
}

function renderAll() {
  const q = getQuery();
  ['léger','flemme','comfort','ubereats','painquotidien'].forEach(cat => {
    const catId = cat === 'léger' ? 'leger' : cat;
    let filtered = meals.filter(m => m.cat === cat);
    if (currentFilter !== 'all' && currentFilter !== cat) filtered = [];
    if (q) filtered = filtered.filter(m => m.name.toLowerCase().includes(q));

    const grid = document.getElementById('grid-' + catId);
    const count = document.getElementById('count-' + catId);
    const section = document.getElementById('section-' + catId);

    count.textContent = `${filtered.length} plat${filtered.length > 1 ? 's' : ''}`;

    if ((currentFilter !== 'all' && currentFilter !== cat)) {
      section.classList.add('hidden');
      return;
    }
    section.classList.remove('hidden');

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-msg">Aucun plat trouvé.</div>`;
      return;
    }

    grid.innerHTML = filtered.map(m => `
      <div class="meal-card ${m.cat}" style="animation-delay:${Math.random()*0.08}s" onclick="openConfirm(${m.id})">
        <div class="card-img">${m.emoji}</div>
        <div class="card-body">
          <div class="meal-name-card">${m.name}</div>
          <div class="meal-tags"><span class="tag ${m.cat}">${m.cat === 'léger' ? '🥗 Léger' : m.cat === 'flemme' ? '🛋️ Flemme' : m.cat === 'ubereats' ? '🛵 UberEats' : m.cat === 'painquotidien' ? '🥐 Pain Quotidien' : '🫕 Comfort'}</span></div>
        </div>
      </div>
    `).join('');
  });
}

function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function rollDice() {
  const q = getQuery();
  let pool = meals;
  if (currentFilter !== 'all') pool = pool.filter(m => m.cat === currentFilter);
  if (q) pool = pool.filter(m => m.name.toLowerCase().includes(q));
  if (!pool.length) { showToast('Aucun plat disponible 😅'); return; }
  const pick = pool[Math.floor(Math.random() * pool.length)];
  document.getElementById('lucky-name').textContent = pick.emoji + ' ' + pick.name;
  document.getElementById('lucky-cat').textContent = pick.cat === 'léger' ? '🥗 Léger' : pick.cat === 'flemme' ? '🛋️ Flemme' : '🫕 Comfort Food';
  const b = document.getElementById('lucky-banner');
  b.style.display = 'none';
  void b.offsetWidth;
  b.style.display = 'block';
}

function closeLucky() {
  document.getElementById('lucky-banner').style.display = 'none';
}


// MODAL
function openModal() {
  selectedCat = null;
  selectedEmoji = '🍝';
  document.getElementById('input-name').value = '';
  document.querySelectorAll('.cat-option').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.emoji-opt').forEach(b => b.classList.remove('selected'));
  document.querySelector('.emoji-opt').classList.add('selected');
  document.getElementById('modal').classList.add('open');
  document.getElementById('input-name').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function maybeClose(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

function selectCat(val) {
  selectedCat = val;
  document.querySelectorAll('.cat-option').forEach(b => b.classList.remove('selected'));
  document.querySelector(`.cat-option[data-val="${val}"]`).classList.add('selected');
}

function selectEmoji(el) {
  selectedEmoji = el.textContent;
  document.querySelectorAll('.emoji-opt').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

function saveNewMeal() {
  const name = document.getElementById('input-name').value.trim();
  if (!name) { showToast('Donne un nom au plat 👀'); return; }
  if (!selectedCat) { showToast('Choisis une catégorie'); return; }
  const newMeal = {
    id: Date.now(),
    name,
    cat: selectedCat,
    emoji: selectedEmoji
  };
  meals.push(newMeal);
  saveMeals(meals);
  closeModal();
  renderAll();
  showToast('✅ ' + name + ' ajouté !');

  const catLabel = selectedCat === 'léger' ? '🥗 Léger' : selectedCat === 'flemme' ? '🛋️ Flemme' : selectedCat === 'ubereats' ? '🛵 UberEats' : selectedCat === 'painquotidien' ? '🥐 Pain Quotidien' : '🫕 Comfort Food';

  if (selectedCat === 'ubereats') {
    const subject = encodeURIComponent('BOGOSS KITCHEN (Notification)');
    const body = encodeURIComponent('Commande UberEats ce soir :\n\n' + selectedEmoji + ' ' + name);
    window.location.href = 'mailto:uheulle@gmail.com?subject=' + subject + '&body=' + body;
  } else {
    const subject = encodeURIComponent('NOUVEAU PLAT (BOGOSS KITCHEN)');
    const ingredients = document.getElementById('input-ingredients') ? document.getElementById('input-ingredients').value.trim() : '';
    const body = encodeURIComponent('Nouveau plat proposé sur BOGOSS KITCHEN !\n\n' + selectedEmoji + ' ' + name + '\n' + 'Catégorie : ' + catLabel + (ingredients ? '\nIngrédients : ' + ingredients : ''));
    window.location.href = 'mailto:uheulle@gmail.com?subject=' + subject + '&body=' + body;
  }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeLucky(); }
  if (e.key === 'Enter' && document.getElementById('modal').classList.contains('open')) saveNewMeal();
});

let confirmMealId = null;
let selectedBoisson = '';

function selectBoisson(el) {
  document.querySelectorAll('.boisson-opt').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedBoisson = el.dataset.boisson;
  const needsDetail = ['Soda', 'Bière', 'Vin'].includes(selectedBoisson);
  document.getElementById('boisson-detail-wrap').style.display = needsDetail ? 'block' : 'none';
  if (!needsDetail) document.getElementById('boisson-detail').value = '';
}

function openConfirm(id) {
  const meal = meals.find(m => m.id === id);
  if (!meal) return;
  confirmMealId = id;
  document.getElementById('confirm-emoji').textContent = meal.emoji;
  document.getElementById('confirm-meal-name').textContent = meal.name;
  document.getElementById('confirm-ingredients').textContent = meal.ingredients || '';
  document.getElementById('confirm-comment').value = '';
  document.getElementById('boisson-detail').value = '';
  document.getElementById('boisson-detail-wrap').style.display = 'none';
  document.querySelectorAll('.boisson-opt').forEach(b => b.classList.remove('selected'));
  selectedBoisson = '';
  document.getElementById('confirm-modal').classList.add('open');
  setTimeout(() => document.getElementById('confirm-comment').focus(), 100);
}

function closeConfirm() {
  document.getElementById('confirm-modal').classList.remove('open');
  confirmMealId = null;
}

function maybeCloseConfirm(e) {
  if (e.target === document.getElementById('confirm-modal')) closeConfirm();
}

function confirmMeal() {
  const meal = meals.find(m => m.id === confirmMealId);
  if (!meal) return;
  const comment = document.getElementById('confirm-comment').value.trim();
  const catLabel = meal.cat === 'léger' ? '🥗 Léger' : meal.cat === 'flemme' ? '🛋️ Flemme' : '🫕 Comfort Food';
  closeConfirm();
  showToast(meal.emoji + ' ' + meal.name + ' confirmé !');
  const subject = encodeURIComponent('BOGOSS KITCHEN (Notification)');
  const boissonDetail = document.getElementById('boisson-detail').value.trim();
  const boissonFull = selectedBoisson ? (selectedBoisson + (boissonDetail ? ' — ' + boissonDetail : '')) : 'Non précisée';
  const body = encodeURIComponent(
    'Plat sélectionné ce soir :\n\n'
    + meal.emoji + ' ' + meal.name + '\n'
    + 'Catégorie : ' + catLabel + '\n'
    + 'Ingrédients : ' + (meal.ingredients || 'N/A') + '\n'
    + 'Boisson : ' + boissonFull
    + (comment ? '\n\nCommentaire : ' + comment : '')
  );
  window.location.href = 'mailto:uheulle@gmail.com?subject=' + subject + '&body=' + body;
}

document.addEventListener('DOMContentLoaded', renderAll);
