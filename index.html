 @media (prefers-color-scheme: dark) {

}

/* === SPLASH SCREEN === */
.splash-screen {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 9999;
  background: #f5f0e8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 40px 32px;
}
.splash-screen.zooming-out {
  transition: opacity 0.45s ease 0.25s;
}

.splash-screen.hidden-out {
  opacity: 0;
  transform: scale(1.04);
  pointer-events: none;
}
.splash-logo {
  width: 180px;
  height: 180px;
  object-fit: contain;
  margin-bottom: 28px;
  animation: splashLogoIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  transform-origin: center;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
}
@keyframes splashLogoIn {
  from { opacity: 0; transform: scale(0.6); }
  to   { opacity: 1; transform: scale(1); }
}
.splash-screen.zooming-out {
  opacity: 0;
  transition: opacity 0.45s ease 0.25s;
}
.splash-screen.zooming-out .splash-logo {
  transform: scale(4);
  opacity: 0;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease 0.1s;
}
.splash-screen.zooming-out .splash-title,
.splash-screen.zooming-out .splash-buttons {
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.splash-title {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.5px;
  color: #1a1a18;
  text-align: center;
  margin-bottom: 64px;
  animation: splashFadeUp 0.5s 0.15s ease both;
}
.splash-title span { color: var(--green); }
@keyframes splashFadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.splash-buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 280px;
  animation: splashFadeUp 0.5s 0.35s ease both;
}
.splash-btn-find {
  background: var(--green);
  color: #000;
  border: none;
  border-radius: 16px;
  padding: 18px;
  font-size: 16px;
  font-weight: 800;

}
.splash-btn-find:hover { opacity: 0.88; transform: scale(1.02); }

  cursor: pointer;

}
.splash-btn-welcome:hover { opacity: 0.78; transform: scale(1.02); }
</style>

const STORAGE_KEY = 'bogoss_kitchen_meals';
let currentFilter = 'all';
let selectedCat = null;
let selectedEmoji = '🍝';

function loadMeals() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) return JSON.parse(stored);
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_MEALS));
}

function saveMeals(meals) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(meals)); } catch(e) {}
}

let meals = loadMeals();

function getQuery() {
  return document.getElementById('search').value.toLowerCase().trim();
}

function getCardBg(m) {
  return (m.photo || m.photos) ? 'background:none;padding:0' : '';
}
function getCardImg(m) {
  const src = m.photos ? m.photos[0] : m.photo;
  if (src) return '<img src="' + src + '" style="width:100%;height:100%;object-fit:cover;border-radius:14px 14px 0 0;">';
  return m.emoji;
}

function renderAll() {
  const q = getQuery();
  ['léger','flemme','comfort','ubereats','painquotidien'].forEach(cat => {
    const catId = cat === 'léger' ? 'leger' : cat;
    let filtered = meals.filter(m => m.cat === cat);
    if (currentFilter !== 'all' && currentFilter !== cat) filtered = [];
    if (q) filtered = filtered.filter(m => (m.name + ' ' + (m.ingredients || '') + ' ' + (m.recipe || '')).toLowerCase().includes(q));

    const grid = document.getElementById('grid-' + catId);
    const count = document.getElementById('count-' + catId);
    const section = document.getElementById('section-' + catId);

    count.textContent = `${filtered.length} plat${filtered.length > 1 ? 's' : ''}`;

    if ((currentFilter !== 'all' && currentFilter !== cat)) {
      section.classList.add('hidden');
      return;
    }
    section.classList.remove('hidden');

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-msg">Aucun plat trouvé.</div>`;
      return;
    }

    grid.innerHTML = filtered.map(m => `
      <div class="meal-card ${m.cat}" style="animation-delay:${Math.random()*0.08}s" onclick="openConfirm(${m.id})">
        <div class="card-img" style="${getCardBg(m)}">${getCardImg(m)}</div>
        <div class="card-body">
          <div class="meal-name-card">${m.name}</div>
          <div class="meal-tags"><span class="tag ${m.cat}">${m.cat === 'léger' ? '🥗 Léger' : m.cat === 'flemme' ? '🛋️ Flemme' : m.cat === 'ubereats' ? '🛵 UberEats' : m.cat === 'painquotidien' ? '🥐 Pain Quotidien' : '🫕 Comfort'}</span></div>
        </div>
      </div>
    `).join('');
  });
}

function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function rollDice() {
  const q = getQuery();
  let pool = meals;
  if (currentFilter !== 'all') pool = pool.filter(m => m.cat === currentFilter);
  if (q) pool = pool.filter(m => (m.name + ' ' + (m.ingredients || '') + ' ' + (m.recipe || '')).toLowerCase().includes(q));
  if (!pool.length) { showToast('Aucun plat disponible 😅'); return; }
  const pick = pool[Math.floor(Math.random() * pool.length)];
  document.getElementById('lucky-name').textContent = pick.emoji + ' ' + pick.name;
  document.getElementById('lucky-cat').textContent = pick.cat === 'léger' ? '🥗 Léger' : pick.cat === 'flemme' ? '🛋️ Flemme' : '🫕 Comfort Food';
  const b = document.getElementById('lucky-banner');
  b.style.display = 'none';
  void b.offsetWidth;
  b.style.display = 'block';
}

function closeLucky() {
  document.getElementById('lucky-banner').style.display = 'none';
}


// MODAL
function openModal() {
  selectedCat = null;
  selectedEmoji = '🍝';
  document.getElementById('input-name').value = '';
  document.querySelectorAll('.cat-option').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.emoji-opt').forEach(b => b.classList.remove('selected'));
  document.querySelector('.emoji-opt').classList.add('selected');
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('input-name').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

function maybeClose(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

function selectCat(val) {
  selectedCat = val;
  document.querySelectorAll('.cat-option').forEach(b => b.classList.remove('selected'));
  document.querySelector(`.cat-option[data-val="${val}"]`).classList.add('selected');
}

function selectEmoji(el) {
  selectedEmoji = el.textContent;
  document.querySelectorAll('.emoji-opt').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

function saveNewMeal() {
  const name = document.getElementById('input-name').value.trim();
  if (!name) { showToast('Donne un nom au plat 👀'); return; }
  if (!selectedCat) { showToast('Choisis une catégorie'); return; }
  const newMeal = {
    id: Date.now(),
    name,
    cat: selectedCat,
    emoji: selectedEmoji
  };
  meals.push(newMeal);
  saveMeals(meals);
  closeModal();
  renderAll();
  showToast('✅ ' + name + ' ajouté !');

  const catLabel = selectedCat === 'léger' ? '🥗 Léger' : selectedCat === 'flemme' ? '🛋️ Flemme' : selectedCat === 'ubereats' ? '🛵 UberEats' : selectedCat === 'painquotidien' ? '🥐 Pain Quotidien' : '🫕 Comfort Food';

  if (selectedCat === 'ubereats') {
    const subject = encodeURIComponent('BOGOSS KITCHEN (Notification)');
    const body = encodeURIComponent('Commande UberEats ce soir :\n\n' + selectedEmoji + ' ' + name);
    window.location.href = 'mailto:uheulle@gmail.com?subject=' + subject + '&body=' + body;
  } else {
    const subject = encodeURIComponent('NOUVEAU PLAT (BOGOSS KITCHEN)');
    const ingredients = document.getElementById('input-ingredients') ? document.getElementById('input-ingredients').value.trim() : '';
    const body = encodeURIComponent('Nouveau plat proposé sur BOGOSS KITCHEN !\n\n' + selectedEmoji + ' ' + name + '\n' + 'Catégorie : ' + catLabel + (ingredients ? '\nIngrédients : ' + ingredients : ''));
    window.location.href = 'mailto:uheulle@gmail.com?subject=' + subject + '&body=' + body;
  }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeLucky(); }
  if (e.key === 'Enter' && document.getElementById('modal').classList.contains('open')) saveNewMeal();
});

let confirmMealId = null;
let selectedBoisson = '';

function selectBoisson(el) {
  document.querySelectorAll('.boisson-opt').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedBoisson = el.dataset.boisson;
  const needsDetail = ['Soda', 'Bière', 'Vin'].includes(selectedBoisson);
  document.getElementById('boisson-detail-wrap').style.display = needsDetail ? 'block' : 'none';
  if (!needsDetail) document.getElementById('boisson-detail').value = '';
}

function openConfirm(id) {
  const meal = meals.find(m => m.id === id);
  if (!meal) return;
  confirmMealId = id;
  const emojiEl = document.getElementById('confirm-emoji');
  const photoWrap = document.getElementById('confirm-photo-wrap');
  const photoImg = document.getElementById('confirm-photo-img');
  const photoImg2 = document.getElementById('confirm-photo-img-2');
  const dots = document.getElementById('carousel-dots');
  const prev = document.getElementById('carousel-prev');
  const next = document.getElementById('carousel-next');
  const photos = meal.photos || (meal.photo ? [meal.photo] : []);
  if (photos.length > 0) {
    photoWrap.style.display = 'block';
    photoImg.src = photos[0];
    photoImg.classList.add('active');
    photoImg2.src = photos[1] || '';
    photoImg2.classList.remove('active');
    emojiEl.style.display = 'none';
    carouselIndex = 0;
    if (photos.length > 1) {
      dots.style.display = 'flex';
      prev.style.display = 'flex';
      next.style.display = 'flex';
    } else {
      dots.style.display = 'none';
      prev.style.display = 'none';
      next.style.display = 'none';
    }
  } else {
    photoWrap.style.display = 'none';
    emojiEl.style.display = 'block';
    emojiEl.textContent = meal.emoji;
  }
  document.getElementById('confirm-meal-name').textContent = meal.name;
  document.getElementById('confirm-ingredients').textContent = meal.ingredients || '';
  const recipeBtn = document.getElementById('recipe-toggle-btn');
  if (meal.recipe) {
    recipeBtn.style.display = 'inline-block';
  } else {
    recipeBtn.style.display = 'none';
  }
  document.getElementById('confirm-comment').value = '';
  document.getElementById('boisson-detail').value = '';
  document.getElementById('boisson-detail-wrap').style.display = 'none';
  document.querySelectorAll('.boisson-opt').forEach(b => b.classList.remove('selected'));
  selectedBoisson = '';
  document.getElementById('confirm-modal').classList.add('open');
  document.getElementById('confirm-close-btn').style.display = 'flex';
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('confirm-comment').focus(), 100);
}

let carouselIndex = 0;
let carouselMealId = null;

function carouselGo(idx) {
  const meal = meals.find(m => m.id === confirmMealId);
  if (!meal) return;
  const photos = meal.photos || (meal.photo ? [meal.photo] : []);
  carouselIndex = idx;
  document.getElementById('confirm-photo-img').src = photos[0] || '';
  document.getElementById('confirm-photo-img-2').src = photos[1] || '';
  document.getElementById('confirm-photo-img').classList.toggle('active', idx === 0);
  document.getElementById('confirm-photo-img-2').classList.toggle('active', idx === 1);
  document.querySelectorAll('.carousel-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
}

function carouselPrev() {
  const meal = meals.find(m => m.id === confirmMealId);
  if (!meal) return;
  const photos = meal.photos || [];
  carouselGo((carouselIndex - 1 + photos.length) % photos.length);
}

function carouselNext() {
  const meal = meals.find(m => m.id === confirmMealId);
  if (!meal) return;
  const photos = meal.photos || [];
  carouselGo((carouselIndex + 1) % photos.length);
}

function openRecipeModal() {
  const meal = meals.find(m => m.id === confirmMealId);
  if (!meal || !meal.recipe) return;
  document.getElementById('recipe-modal-name').textContent = meal.name;
  document.getElementById('recipe-modal-text').textContent = meal.recipe;
  document.getElementById('recipe-modal-overlay').classList.add('open');
}

function closeRecipeModal() {
  document.getElementById('recipe-modal-overlay').classList.remove('open');
}

function maybeCloseRecipe(e) {
  if (e.target === document.getElementById('recipe-modal-overlay')) closeRecipeModal();
}

function closeConfirm() {
  document.getElementById('confirm-modal').classList.remove('open');
  document.getElementById('confirm-close-btn').style.display = 'none';
  document.body.style.overflow = '';
  document.getElementById('confirm-photo-wrap').style.display = 'none';
  closeRecipeModal();
  document.getElementById('confirm-photo-img').src = '';
  document.getElementById('confirm-emoji').style.display = 'block';
  confirmMealId = null;
}

function maybeCloseConfirm(e) {
  if (e.target === document.getElementById('confirm-modal')) closeConfirm();
}

function confirmMeal() {
  const meal = meals.find(m => m.id === confirmMealId);
  if (!meal) return;
  const comment = document.getElementById('confirm-comment').value.trim();
  const catLabel = meal.cat === 'léger' ? '🥗 Léger' : meal.cat === 'flemme' ? '🛋️ Flemme' : '🫕 Comfort Food';
  closeConfirm();
  showToast(meal.emoji + ' ' + meal.name + ' confirmé !');
  const subject = encodeURIComponent('BOGOSS KITCHEN (Notification)');
  const boissonDetail = document.getElementById('boisson-detail').value.trim();
  const boissonFull = selectedBoisson ? (selectedBoisson + (boissonDetail ? ' — ' + boissonDetail : '')) : 'Non précisée';
  const body = encodeURIComponent(
    'Plat sélectionné ce soir :\n\n'
    + meal.emoji + ' ' + meal.name + '\n'
    + 'Catégorie : ' + catLabel + '\n'
    + 'Ingrédients : ' + (meal.ingredients || 'N/A') + '\n'
    + 'Boisson : ' + boissonFull
    + (comment ? '\n\nCommentaire : ' + comment : '')
  );
  window.location.href = 'mailto:uheulle@gmail.com?subject=' + subject + '&body=' + body;
}

function closeSplash() {
  const splash = document.getElementById('splash-screen');
  splash.style.opacity = '0';
  splash.style.transition = 'opacity 0.4s ease';
  setTimeout(() => {
    splash.style.display = 'none';
    document.body.style.overflow = '';
  }, 420);
}

document.addEventListener('DOMContentLoaded', renderAll);

window.onscroll = function() {
  const header = document.querySelector("header");
  if (window.pageYOffset > 50) {
    header.classList.add("scrolled");
  } else {
    header.classList.remove("scrolled");
  }
};
